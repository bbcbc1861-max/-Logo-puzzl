<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بازل بلقيس</title>
<style>
:root{--navy:#072a8f;--gold:#b08a52;--paper:#faf7f1;--ink:#0b1b4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;padding:20px 14px 32px;min-height:100vh}
h1{margin:4px 0 2px;font-size:clamp(26px,6vw,38px);color:var(--navy);font-weight:800}
p.sub{margin:0 0 16px;color:#5a6490;font-size:16px}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{background:#fff;border:2px solid var(--navy);border-radius:12px;padding:6px 18px;text-align:center;min-width:100px}
.stat b{display:block;font-size:24px;color:var(--navy);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--gold)}
#board{width:min(94vw,640px);aspect-ratio:840/599;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px;background:var(--gold);padding:4px;border-radius:10px;direction:ltr;touch-action:manipulation}
.p{background-image:url(logo.jpg);background-size:300% 300%;border-radius:4px;cursor:grab;border:0;padding:0;transition:transform .15s,box-shadow .15s}
.p.sel{transform:scale(.94);box-shadow:0 0 0 4px var(--navy) inset}
.p:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
#board.done{gap:0;padding:0;background:none}
#board.done .p{border-radius:0;cursor:default}
.btns{display:flex;gap:10px;margin-top:16px}
button.b{font:inherit;font-size:17px;font-weight:700;border-radius:12px;padding:10px 22px;border:2px solid var(--navy);cursor:pointer;background:var(--navy);color:#fff}
button.b.alt{background:#fff;color:var(--navy)}
#win{margin-top:16px;padding:14px 20px;background:#fff;border:2px solid var(--gold);border-radius:14px;font-size:20px;font-weight:800;color:var(--navy);text-align:center;display:none}
#win.show{display:block}
#peek{position:fixed;inset:0;background:rgba(7,20,60,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
#peek.show{display:flex}
#peek img{width:min(94vw,640px);border-radius:10px;background:#fff}
@media (prefers-reduced-motion:reduce){.p{transition:none}}
</style>
</head>
<body>
<h1>بازل بلقيس</h1>
<p class="sub">رتّب القطع التسع لتكتمل الصورة</p>
<div class="stats">
<div class="stat"><b id="time">0:00</b><span>الوقت</span></div>
<div class="stat"><b id="moves">0</b><span>الحركات</span></div>
</div>
<div id="board" aria-label="لوحة البازل"></div>
<div id="win">أحسنت! أكملت البازل 🎉</div>
<div class="btns">
<button class="b" id="shuffle">خلط من جديد</button>
<button class="b alt" id="show">عرض الصورة</button>
</div>
<div id="peek"><img src="logo.jpg" alt="الصورة الأصلية"></div>
<script>
const board=document.getElementById('board'),winEl=document.getElementById('win'),peek=document.getElementById('peek');
let order,sel=null,moves=0,t0=null,timer=null,done=false;
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function render(){
  board.innerHTML='';
  order.forEach((v,i)=>{
    const d=document.createElement('button');
    d.className='p'+(sel===i?' sel':'');
    d.style.backgroundPosition=(v%3*50)+'% '+(Math.floor(v/3)*50)+'%';
    d.setAttribute('aria-label','قطعة '+(i+1));
    d.draggable=!done;
    d.onclick=()=>pick(i);
    d.ondragstart=e=>{e.dataTransfer.setData('text/plain',i)};
    d.ondragover=e=>e.preventDefault();
    d.ondrop=e=>{e.preventDefault();swap(+e.dataTransfer.getData('text/plain'),i)};
    board.appendChild(d);
  });
}
function start(){
  if(timer)return;
  t0=Date.now();
  timer=setInterval(()=>{document.getElementById('time').textContent=fmt(Math.floor((Date.now()-t0)/1000))},500);
}
function pick(i){
  if(done)return;
  if(sel===null){sel=i;render();return}
  const a=sel;sel=null;
  swap(a,i);
}
function swap(a,b){
  if(done||a===b||isNaN(a)){sel=null;render();return}
  start();
  [order[a],order[b]]=[order[b],order[a]];
  moves++;document.getElementById('moves').textContent=moves;
  sel=null;
  if(order.every((v,i)=>v===i)){
    done=true;clearInterval(timer);
    const s=Math.floor((Date.now()-t0)/1000);
    document.getElementById('time').textContent=fmt(s);
    winEl.textContent='أحسنت! أكملت البازل في '+fmt(s)+' و'+moves+' حركة 🎉';
    winEl.classList.add('show');board.classList.add('done');
  }
  render();
}
function init(){
  do{order=[0,1,2,3,4,5,6,7,8].sort(()=>Math.random()-.5)}while(order.every((v,i)=>v===i));
  sel=null;moves=0;done=false;t0=null;clearInterval(timer);timer=null;
  document.getElementById('time').textContent='0:00';
  document.getElementById('moves').textContent='0';
  winEl.classList.remove('show');board.classList.remove('done');
  render();
}
document.getElementById('shuffle').onclick=init;
document.getElementById('show').onclick=()=>peek.classList.add('show');
peek.onclick=()=>peek.classList.remove('show');
init();
</script>
</body>
</html>
